name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'src/landing/**'
      - 'vite.config.landing.mts'
      - 'scripts/fetch-store-stats.ts'
      - '.github/workflows/deploy-landing.yml'
      - '.github/workflows/update-store-stats.yml'

permissions:
  contents: read

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.release-version.outputs.should-release }}
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release version
        id: release-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git show-ref --verify --quiet "refs/tags/v${version}"; then
            echo "should-release=false" >> "${GITHUB_OUTPUT}"
            echo "v${version} is already released."
          else
            echo "should-release=true" >> "${GITHUB_OUTPUT}"
            echo "v${version} is ready to release."
          fi

  release:
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Chrome extension
        run: pnpm build

      - name: Build Firefox extension
        run: pnpm build-firefox

      - name: Generate release app token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${package_version}" != "${RELEASE_VERSION}" ]]; then
            echo "Release version changed between jobs." >&2
            exit 1
          fi
          pnpm exec semantic-release

      - name: Publish Edge Add-ons
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: node scripts/publish-edge.mjs "${RELEASE_VERSION}"
